<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==================================================
         META
    ================================================== -->

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- ==================================================
         FAVICON
    ================================================== -->

    <link
        rel="icon"
        href="/assets/favicon/favicon.ico"
        sizes="any"
    >


    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/assets/favicon/favicon-32x32.png"
    >


    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="/assets/favicon/favicon-16x16.png"
    >


    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/assets/favicon/favicon-180x180.png"
    >


    <!-- ==================================================
         GOOGLE ANALYTICS 4
    ================================================== -->

    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-VECH9J2L1M"
    ></script>


    <script>

        window.dataLayer =
            window.dataLayer || [];


        function gtag() {

            dataLayer.push(
                arguments
            );

        }


        gtag(
            'js',
            new Date()
        );


        gtag(
            'config',
            'G-VECH9J2L1M'
        );

    </script>


    <!-- ==================================================
         GOOGLE FONTS
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        onload="this.onload=null;this.rel='stylesheet'"
    >


    <noscript>

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        >

    </noscript>


    <!-- ==================================================
         PROJECT CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >


    <link
        rel="stylesheet"
        href="css/global.min.css"
    >


    <link
        rel="stylesheet"
        href="css/components.min.css"
    >


    <link
        rel="stylesheet"
        href="css/service.min.css"
    >


    <link
        rel="stylesheet"
        href="css/responsive.min.css"
    >

</head>


<body
    class="services-page"
>


    <!-- ==================================================
         SCROLL TO TOP
    ================================================== -->

    <div
        id="scroll-to-top-container"
    ></div>


    <!-- ==================================================
         NAVBAR
    ================================================== -->

    <div
        id="navbar-container"
    ></div>


    <main>


        <!-- ==================================================
             HERO
        ================================================== -->

        <section
            class="services-hero"
        >

            <div
                class="services-inner"
            >

                <div
                    class="services-hero-content"
                >

                    <p
                        class="section-label reveal"
                    ></p>


                    <h1
                        class="reveal"
                    ></h1>


                    <p
                        class="services-hero-copy reveal"
                    ></p>


                    <div
                        id="hero-action-buttons"
                        class="action-buttons reveal"
                    ></div>

                </div>

            </div>

        </section>


        <!-- ==================================================
             PHILOSOPHY
        ================================================== -->

        <section
            class="philosophy-section"
        >

            <div
                class="services-inner"
            >

                <p
                    class="section-label"
                ></p>


                <div
                    class="philosophy-text"
                >

                    <span
                        class="philosophy-line-one"
                    ></span>


                    <span
                        class="philosophy-line-two"
                    ></span>

                </div>

            </div>

        </section>


        <!-- ==================================================
             SERVICES
        ================================================== -->

        <section
            class="services-section"
        >

            <div
                class="services-inner"
            >

                <div
                    class="services-header"
                >

                    <p
                        class="section-label reveal"
                    ></p>


                    <h2
                        class="reveal"
                    ></h2>

                </div>


                <div
                    id="services-list"
                ></div>

            </div>

        </section>


        <!-- ==================================================
             INDUSTRIES
        ================================================== -->

        <section
            class="industries-section"
        >

            <div
                class="services-inner"
            >

                <div
                    class="industries-header"
                >

                    <p
                        class="section-label reveal"
                    ></p>


                    <h2
                        class="reveal"
                    ></h2>

                </div>


                <div
                    id="industry-grid"
                    class="industry-grid"
                ></div>

            </div>

        </section>


        <!-- ==================================================
             HOW WE WORK
        ================================================== -->

        <section
            class="process-section"
        >

            <div
                class="services-inner"
            >

                <div
                    class="process-header"
                >

                    <p
                        class="section-label reveal"
                    ></p>


                    <h2
                        class="reveal"
                    ></h2>

                </div>


                <div
                    id="process-list"
                    class="process-list"
                ></div>

            </div>

        </section>


        <!-- ==================================================
             WHY CLIENTS
        ================================================== -->

        <section
            class="why-section"
        >

            <div
                class="services-inner"
            >

                <div
                    class="why-header"
                >

                    <p
                        class="section-label reveal"
                    ></p>


                    <h2
                        class="reveal"
                    ></h2>

                </div>


                <div
                    id="why-grid"
                    class="why-grid"
                ></div>

            </div>

        </section>


        <!-- ==================================================
             TESTIMONIAL
        ================================================== -->

        <section
            class="testimonial-section"
        >

            <div
                class="services-inner"
            >

                <div
                    class="testimonial reveal"
                >

                    <p
                        class="testimonial-quote"
                    ></p>

                </div>

            </div>

        </section>


        <!-- ==================================================
             TRANSITION IMAGE
        ================================================== -->

        <section
            class="cta-transition reveal"
        >

            <img
                id="cta-transition-image"
                class="cta-transition-image"
                src=""
                alt=""
                loading="lazy"
                data-root-file=""
            >


            <div
                class="cta-transition-overlay"
            ></div>


            <div
                class="cta-transition-content"
            >

                <p
                    class="cta-transition-label"
                ></p>

            </div>

        </section>


        <!-- ==================================================
             FINAL CTA
             Shared CTA component
        ================================================== -->

        <section
            class="final-cta"
        >

            <div
                class="final-cta-inner"
            >

                <h2></h2>


                <p
                    class="final-cta-copy"
                ></p>


                <div
                    id="final-cta-buttons"
                    class="cta-buttons reveal"
                ></div>

            </div>

        </section>


    </main>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <div
        id="footer-container"
    ></div>


    <!-- ==================================================
         GSAP
    ================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
    ></script>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"
    ></script>


    <!-- ==================================================
         SERVICES PAGE JAVASCRIPT
    ================================================== -->

    <script
        src="/js/service.js?v=2"
    ></script>


    <!-- ==================================================
         SEO
    ================================================== -->

    <script
        src="/js/seo.js?v=1"
    ></script>


</body>

</html>
