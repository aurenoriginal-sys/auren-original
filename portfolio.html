<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==================================================
         META
    ================================================== -->

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- ==================================================
         FAVICON
    ================================================== -->

    <link
        rel="icon"
        href="/assets/favicon/favicon.ico"
        sizes="any"
    >


    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/assets/favicon/favicon-32x32.png"
    >


    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="/assets/favicon/favicon-16x16.png"
    >


    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/assets/favicon/favicon-180x180.png"
    >


    <!-- ==================================================
         GOOGLE ANALYTICS 4
    ================================================== -->

    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-VECH9J2L1M"
    ></script>


    <script>

        window.dataLayer =
            window.dataLayer || [];


        function gtag() {

            dataLayer.push(
                arguments
            );

        }


        gtag(
            'js',
            new Date()
        );


        gtag(
            'config',
            'G-VECH9J2L1M'
        );

    </script>


    <!-- ==================================================
         GOOGLE FONTS
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        onload="this.onload=null;this.rel='stylesheet'"
    >


    <noscript>

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        >

    </noscript>


    <!-- ==================================================
         PROJECT CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >


    <link
        rel="stylesheet"
        href="css/global.min.css"
    >


    <link
        rel="stylesheet"
        href="css/components.min.css"
    >


    <link
        rel="stylesheet"
        href="css/portfolio.min.css"
    >


    <link
        rel="stylesheet"
        href="css/responsive.min.css"
    >

</head>


<body>


    <!-- ==================================================
         NAVBAR
    ================================================== -->

    <div
        id="navbar-container"
    ></div>


    <!-- ==================================================
         PORTFOLIO MAIN
    ================================================== -->

    <main
        class="portfolio-main"
    >


        <!-- ==================================================
             PORTFOLIO HEADER
        ================================================== -->

        <header
            class="portfolio-header"
        >

            <p
                class="portfolio-label"
            ></p>


            <h1
                class="portfolio-title"
            ></h1>


            <p
                class="portfolio-description"
            ></p>

        </header>


        <!-- ==================================================
             CATEGORY FILTER
        ================================================== -->

        <section
            class="category-filter-section"
        >

            <div
                id="category-container"
                class="category-container"
            ></div>

        </section>


        <!-- ==================================================
             PROJECTS
        ================================================== -->

        <section
            class="portfolio-grid-section"
        >

            <div
                id="portfolio-projects"
                class="portfolio-stack"
            ></div>

        </section>


    </main>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <div
        id="footer-container"
    ></div>


    <!-- ==================================================
         GSAP
    ================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
    ></script>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"
    ></script>


    <!-- ==================================================
         PORTFOLIO JAVASCRIPT
    ================================================== -->

    <script
        src="/js/portfolio.js?v=2"
    ></script>


    <!-- ==================================================
         SEO
    ================================================== -->

    <script
        src="/js/seo.js?v=2"
    ></script>


</body>

</html>
