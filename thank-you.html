    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;

            min-height: 100%;

        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #000000;

            color: #ffffff;

            font-family:
                'Inter',
                sans-serif;

            text-align: center;

        }


        .thank-you {

            width:
                min(
                    850px,
                    90%
                );

        }


        .label {

            margin-bottom:
                22px;

            color:
                #FDAF45;

            font-size:
                0.72rem;

            font-weight:
                500;

            letter-spacing:
                2px;

            text-transform:
                uppercase;

        }


        h1 {

            font-family:
                'Playfair Display',
                serif;

            font-size:
                clamp(
                    3.5rem,
                    6vw,
                    6rem
                );

            font-weight:
                400;

            line-height:
                1;

        }


        h1 span {

            display:
                block;

            color:
                #FDAF45;

            font-style:
                italic;

            margin-top:
                7px;

        }


        p {

            max-width:
                560px;

            margin:
                30px auto 0;

            color:
                #888888;

            font-size:
                0.95rem;

            line-height:
                1.8;

        }


        .countdown {

            margin-top:
                30px;

            color:

        }

            color:

        }

<body>


    <main
        class="thank-you"
    >

        <div
            class="label"
        >
            Thank You
        </div>


        <h1>

            Your message
            <span>
                has been received.
            </span>

        </h1>


        <p>

            Thank you for reaching out to
            Auren Originals. We'll review your
            project details and get back to you
            shortly.

        </p>


        <div
            class="countdown"
        >

            Returning home in
            <span id="seconds">
                5
            </span>
            seconds...

        </div>

    </main>


    <script>

        let seconds =
            5;


        const counter =
            document.getElementById(
                'seconds'
            );


        const timer =
            setInterval(
                () => {

                    seconds--;

                    counter.textContent =
                        seconds;


                    if (
                        seconds <= 0
                    ) {

                        clearInterval(
                            timer
                        );


                        window.location.href =
                            'index.html';

                    }

                },
                1000
            );

    </script>

</body>
