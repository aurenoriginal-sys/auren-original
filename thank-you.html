    <style>

        /* ==================================================
           THANK YOU PAGE
        ================================================== */

        .thank-you-page {

            min-height:
                100vh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #000000;

            color:
                #ffffff;

            text-align:
                center;

        }


        .thank-you {

            width:
                min(
                    850px,
                    90%
                );

            margin:
                0 auto;

        }


        .thank-you .label {

            margin-bottom:
                22px;

            color:
                var(--highlight);

            font-family:
                var(--font-body);

            font-size:
                0.72rem;

            font-weight:
                500;

            letter-spacing:
                2px;

            text-transform:
                uppercase;

        }


        .thank-you h1 {

            margin:
                0;

            color:
                #ffffff;

            font-family:
                var(--font-heading);

            font-size:
                clamp(
                    3.5rem,
                    6vw,
                    6rem
                );

            font-weight:
                400;

            line-height:
                1;

        }


        .thank-you h1 span {

            display:
                block;

            margin-top:
                7px;

            color:
                var(--highlight);

            font-style:
                italic;

        }


        .thank-you-copy {

            max-width:
                560px;

            margin:
                30px auto 0;

            color:
                var(--muted);

            font-family:
                var(--font-body);

            font-size:
                0.95rem;

            line-height:
                1.8;

        }


        .countdown {

            margin-top:
                30px;

            color:
                #ffffff;

            font-family:
                var(--font-body);

            font-size:
                0.78rem;

        }


        #seconds {

            color:
                var(--highlight);

        }


        @media (max-width: 700px) {

            .thank-you {

                width:
                    88%;

            }


            .thank-you .label {

                margin-bottom:
                    14px;

                font-size:
                    0.48rem;

                letter-spacing:
                    1.5px;

            }


            .thank-you h1 {

                font-size:
                    2.55rem;

            }


            .thank-you-copy {

                max-width:
                    285px;

                margin-top:
                    22px;

                font-size:
                    0.58rem;

                line-height:
                    1.6;

            }


            .countdown {

                margin-top:
                    22px;

                font-size:
                    0.50rem;

            }

        }


        @media (max-width: 380px) {

            .thank-you h1 {

                font-size:
                    2.30rem;

            }

        }

    </style>

</head>


<body
    class="thank-you-page"
>


    <main
        class="thank-you"
    >

        <div
            class="label"
        >
            Thank You
        </div>


        <h1>

            Your message

            <span>
                has been received.
            </span>

        </h1>


        <p
            class="thank-you-copy"
        >

            Thank you for reaching out to
            Auren Originals. We'll review your
            project details and get back to you
            shortly.

        </p>


        <div
            class="countdown"
        >

            Returning home in

            <span
                id="seconds"
            >
                5
            </span>

            seconds...

        </div>

    </main>


    <script>

        let seconds =
            5;


        const counter =
            document.getElementById(
                'seconds'
            );


        const timer =
            setInterval(
                () => {

                    seconds--;


                    counter.textContent =
                        seconds;


                    if (
                        seconds <=
                        0
                    ) {

                        clearInterval(
                            timer
                        );


                        window.location.href =
                            'index.html';

                    }

                },
                1000
            );

    </script>

</body>
