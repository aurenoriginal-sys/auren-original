<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Branding | Auren Originals
    </title>


    <!-- ==================================================
         GOOGLE FONTS
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==================================================
           THEME
        ================================================== */

        :root {

            --bg-main:
                #000000;

            --bg-secondary:
                #1f1f1f;

            --text-main:
                #ffffff;

            --text-muted:
                #888888;

            --highlight:
                #FDAF45;

            --font-heading:
                'Playfair Display',
                serif;

            --font-body:
                'Inter',
                sans-serif;

        }


        /* ==================================================
           RESET
        ================================================== */

        * {

            margin:
                0;

            padding:
                0;

            box-sizing:
                border-box;

        }


        html {

            width:
                100%;

            scroll-behavior:
                smooth;

            overflow-x:
                hidden;

        }


        body {

            width:
                100%;

            min-width:
                320px;

            margin:
                0;

            padding:
                0;

            background:
                #000000;

            color:
                #ffffff;

            font-family:
                var(--font-body);

            overflow-x:
                hidden;

        }


        h1,
        h2,
        h3 {

            font-family:
                var(--font-heading);

            font-weight:
                400;

        }


        img {

            display:
                block;

            max-width:
                100%;

        }


        button {

            font:
                inherit;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        .highlight {

            color:
                var(--highlight);

        }


        /* ==================================================
           COMPONENT CONTAINERS
        ================================================== */

        #navbar-container {

            position:
                relative;

            z-index:
                10000;

            width:
                100%;

            height:
                54px;

        }


        #footer-container {

            width:
                100%;

            overflow:
                hidden;

        }


        #scroll-to-top-container {

            position:
                relative;

            z-index:
                99999;

        }


        /* ==================================================
           HERO
        ================================================== */

        .hero-section {

            position:
                relative;

            width:
                100%;

            height:
                430px;

            min-height:
                430px;

            overflow:
                hidden;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            background:
                #000000;

        }


        /* ==================================================
           HERO IMAGE
        ================================================== */

        .hero-image {

            position:
                absolute;

            top:
                6%;

            left:
                0;

            width:
                100%;

            height:
                108%;

            object-fit:
                cover;

            object-position:
                center;

            z-index:
                0;

            visibility:
                hidden;

            transform:
                scale(
                    1.05
                );

            animation:
                heroZoom
                8s
                ease-out
                forwards;

        }


        @keyframes heroZoom {

            from {

                transform:
                    scale(
                        1.07
                    );

            }

            to {

                transform:
                    scale(
                        1
                    );

            }

        }


        /* ==================================================
           HERO GRADIENT
        ================================================== */

        .hero-overlay {

            position:
                absolute;

            inset:
                0;

            z-index:
                1;

            pointer-events:
                none;

            background:

                linear-gradient(
                    to bottom,

                    rgba(
                        0,
                        0,
                        0,
                        0
                    ) 0%,

                    rgba(
                        0,
                        0,
                        0,
                        0
                    ) 46%,

                    rgba(
                        0,
                        0,
                        0,
                        0.06
                    ) 53%,

                    rgba(
                        0,
                        0,
                        0,
                        0.14
                    ) 61%,

                    rgba(
                        0,
                        0,
                        0,
                        0.34
                    ) 71%,

                    rgba(
                        0,
                        0,
                        0,
                        0.62
                    ) 82%,

                    rgba(
                        0,
                        0,
                        0,
                        0.86
                    ) 93%,

                    #000000 100%
                );

        }


        /* ==================================================
           HERO CONTENT
        ================================================== */

        .hero-content {

            position:
                relative;

            z-index:
                2;

            width:
                100%;

            max-width:
                1000px;

            padding:
                0 5%;

            transform:
                translateY(
                    25px
                );

            opacity:
                0;

        }


        /* ==================================================
           BACK TO PORTFOLIO
        ================================================== */

        .back-link {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            margin:
                0 0 16px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.78
                );

            font-family:
                var(--font-body);

            font-size:
                0.74rem;

            font-weight:
                500;

            letter-spacing:
                1.3px;

            text-transform:
                uppercase;

            cursor:
                pointer;

            transition:
                color
                0.3s ease,

                opacity
                0.3s ease,

                transform
                0.3s ease;

        }


        .back-link:hover {

            color:
                var(--highlight);

            opacity:
                1;

            transform:
                translateX(
                    -3px
                );

        }


        /* ==================================================
           HERO TITLE
        ================================================== */

        .hero-content h1 {

            margin:
                0 0 16px;

            font-size:
                clamp(
                    3.4rem,
                    5vw,
                    5.3rem
                );

            line-height:
                1;

            letter-spacing:
                -0.025em;

        }


        .hero-content p {

            max-width:
                850px;

            margin:
                0 auto;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.84
                );

            font-size:
                1rem;

            line-height:
                1.65;

        }


        /* ==================================================
           MEDIA FILTER
        ================================================== */

        .media-filter-section {

            width:
                100%;

            padding:
                24px 5% 34px;

            background:
                #000000;

        }


        .media-filter {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                7px;

        }


        .media-btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-width:
                78px;

            min-height:
                36px;

            padding:
                8px 16px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            border-radius:
                9px;

            background:
                transparent;

            color:
                #ffffff;

            font-family:
                var(--font-body);

            font-size:
                0.75rem;

            font-weight:
                500;

            cursor:
                pointer;

            transition:
                background-color
                0.25s ease,

                border-color
                0.25s ease,

                color
                0.25s ease;

        }


        .media-btn:hover {

            border-color:
                rgba(
                    253,
                    175,
                    69,
                    0.65
                );

        }


        .media-btn.active {

            background:
                var(--highlight);

            border-color:
                var(--highlight);

            color:
                #111111;

        }


        /* ==================================================
           GALLERY
        ================================================== */

        .gallery-grid-section {

            width:
                100%;

            max-width:
                1450px;

            margin:
                0 auto;

            padding:
                8px 5% 110px;

        }


        .gallery-grid {

            width:
                100%;

            column-count:
                3;

            column-gap:
                18px;

        }


        .gallery-item {

            display:
                inline-block;

            width:
                100%;

            margin:
                0 0 18px;

            vertical-align:
                top;

            break-inside:
                avoid;

            page-break-inside:
                avoid;

            overflow:
                hidden;

            border-radius:
                11px;

            background:
                #111111;

        }


        /* ==================================================
           PHOTOS
        ================================================== */

        .gallery-item img {

            display:
                block;

            width:
                100%;

            height:
                auto;

            object-fit:
                cover;

            transition:
                transform
                0.7s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                opacity
                0.35s
                ease;

        }


        .gallery-item:hover img {

            transform:
                scale(
                    1.035
                );

            opacity:
                0.94;

        }


        /* ==================================================
           VIDEOS
        ================================================== */

        .video-item video {

            display:
                block;

            width:
                100%;

            height:
                auto;

            background:
                #000000;

            object-fit:
                contain;

            cursor:
                pointer;

        }


        .video-item:hover video {

            opacity:
                0.96;

        }


        /* ==================================================
           EMPTY
        ================================================== */

        .empty-message {

            width:
                100%;

            padding:
                80px 20px;

            color:
                var(--text-muted);

            font-size:
                0.85rem;

            line-height:
                1.6;

            text-align:
                center;

            column-span:
                all;

        }


        /* ==================================================
           VIDEO BACKDROP
        ================================================== */

        .video-backdrop {

            position:
                fixed;

            inset:
                0;

            z-index:
                10000;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.86
                );

            cursor:
                pointer;

        }


        /* ==================================================
           VIDEO ZOOM
        ================================================== */

        .video-item.video-zoomed {

            position:
                fixed;

            top:
                50%;

            left:
                50%;

            width:
                auto;

            max-width:
                84vw;

            max-height:
                84vh;

            transform:
                translate(
                    -50%,
                    -50%
                ) !important;

            z-index:
                10001;

            margin:
                0;

            overflow:
                visible;

            border-radius:
                10px;

            background:
                #000000;

            box-shadow:
                0 30px 100px
                rgba(
                    0,
                    0,
                    0,
                    0.85
                );

        }


        .video-item.video-zoomed video {

            display:
                block;

            width:
                auto;

            max-width:
                84vw;

            max-height:
                84vh;

            object-fit:
                contain;

            transform:
                none !important;

            opacity:
                1;

        }


        /* ==================================================
           CLOSE BUTTON
        ================================================== */

        .video-close-btn {

            position:
                absolute;

            top:
                -48px;

            right:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                40px;

            height:
                40px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            border-radius:
                50%;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.75
                );

            color:
                #ffffff;

            font-family:
                Arial,
                sans-serif;

            font-size:
                24px;

            line-height:
                1;

            cursor:
                pointer;

            z-index:
                10002;

        }


        .video-close-btn:hover {

            background:
                var(--highlight);

            color:
                #000000;

            border-color:
                var(--highlight);

        }


        /* ==================================================
           TABLET
        ================================================== */

        @media (max-width: 900px) {

            .gallery-grid {

                column-count:
                    2;

            }

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 767px) {

            body {

                width:
                    100%;

                min-width:
                    320px;

                background:
                    #000000;

            }


            #navbar-container {

                width:
                    100%;

                height:
                    54px;

            }


            #navbar-container .navbar {

                width:
                    100%;

                max-width:
                    none;

            }


            /* ==================================================
               HERO
            ================================================== */

            .hero-section {

                width:
                    100%;

                height:
                    120px;

                min-height:
                    120px;

                max-height:
                    120px;

            }


            /* ==================================================
               HERO IMAGE LOWER
            ================================================== */

            .hero-image {

                top:
                    8%;

                height:
                    110%;

                object-position:
                    center 60%;

            }


            /* ==================================================
               LONG MOBILE GRADIENT
            ================================================== */

            .hero-overlay {

                background:

                    linear-gradient(
                        to bottom,

                        rgba(
                            0,
                            0,
                            0,
                            0
                        ) 0%,

                        rgba(
                            0,
                            0,
                            0,
                            0
                        ) 35%,

                        rgba(
                            0,
                            0,
                            0,
                            0.03
                        ) 42%,

                        rgba(
                            0,
                            0,
                            0,
                            0.10
                        ) 50%,

                        rgba(
                            0,
                            0,
                            0,
                            0.22
                        ) 58%,

                        rgba(
                            0,
                            0,
                            0,
                            0.40
                        ) 66%,

                        rgba(
                            0,
                            0,
                            0,
                            0.60
                        ) 74%,

                        rgba(
                            0,
                            0,
                            0,
                            0.78
                        ) 84%,

                        rgba(
                            0,
                            0,
                            0,
                            0.92
                        ) 93%,

                        #000000 100%
                    );

            }


            /* ==================================================
               HERO CONTENT
            ================================================== */

            .hero-content {

                width:
                    100%;

                max-width:
                    none;

                padding:
                    0 14px;

                transform:
                    translateY(
                        2px
                    );

            }


            .back-link {

                display:
                    inline-flex;

                margin:
                    0 0 4px;

                color:
                    rgba(
                        255,
                        255,
                        255,
                        0.76
                    );

                font-size:
                    0.33rem;

                font-weight:
                    500;

                letter-spacing:
                    0.75px;

                line-height:
                    1;

                text-transform:
                    none;

            }


            .hero-content h1 {

                margin:
                    0 0 3px;

                font-size:
                    1.22rem;

                line-height:
                    1;

                letter-spacing:
                    -0.015em;

            }


            .hero-content p {

                max-width:
                    235px;

                font-size:
                    0.33rem;

                line-height:
                    1.32;

            }


            /* ==================================================
               MEDIA BUTTONS
            ================================================== */

            .media-filter-section {

                width:
                    100%;

                padding:
                    14px 0 20px;

            }


            .media-filter {

                gap:
                    6px;

            }


            .media-btn {

                min-width:
                    42px;

                min-height:
                    18px;

                height:
                    18px;

                padding:
                    3px 9px;

                border-radius:
                    6px;

                font-size:
                    0.33rem;

                line-height:
                    1;

            }


            /* ==================================================
               MASONRY GALLERY
            ================================================== */

            .gallery-grid-section {

                width:
                    100%;

                max-width:
                    none;

                margin:
                    0;

                padding:
                    0 10px 52px;

            }


            .gallery-grid {

                width:
                    100%;

                column-count:
                    3;

                column-gap:
                    4px;

            }


            .gallery-item {

                width:
                    100%;

                margin:
                    0 0 4px;

                border-radius:
                    4px;

            }


            .gallery-item img {

                width:
                    100%;

                height:
                    auto;

                transform:
                    none;

            }


            .gallery-item:hover img {

                transform:
                    none;

                opacity:
                    1;

            }


            .video-item video {

                width:
                    100%;

                height:
                    auto;

            }


            /* ==================================================
               VIDEO ZOOM
            ================================================== */

            .video-item.video-zoomed {

                max-width:
                    88vw;

                max-height:
                    72vh;

                border-radius:
                    7px;

            }


            .video-item.video-zoomed video {

                max-width:
                    88vw;

                max-height:
                    72vh;

            }


            .video-close-btn {

                top:
                    -34px;

                width:
                    28px;

                height:
                    28px;

                font-size:
                    19px;

            }


            .empty-message {

                padding:
                    35px 10px;

                font-size:
                    0.52rem;

            }

        }


        /* ==================================================
           SMALL PHONES
        ================================================== */

        @media (max-width: 480px) {

            .hero-section {

                height:
                    114px;

                min-height:
                    114px;

                max-height:
                    114px;

            }


            .hero-image {

                top:
                    9%;

                height:
                    111%;

                object-position:
                    center 61%;

            }


            .hero-content {

                padding:
                    0 12px;

            }


            .back-link {

                margin-bottom:
                    3px;

                font-size:
                    0.31rem;

            }


            .hero-content h1 {

                font-size:
                    1.14rem;

            }


            .hero-content p {

                max-width:
                    220px;

                font-size:
                    0.31rem;

            }


            .media-filter-section {

                padding:
                    13px 0 18px;

            }


            .gallery-grid-section {

                padding:
                    0 9px 46px;

            }


            .gallery-grid {

                column-gap:
                    3px;

            }


            .gallery-item {

                margin-bottom:
                    3px;

                border-radius:
                    3px;

            }

        }


        /* ==================================================
           VERY SMALL PHONES
        ================================================== */

        @media (max-width: 360px) {

            .hero-section {

                height:
                    108px;

                min-height:
                    108px;

                max-height:
                    108px;

            }


            .hero-image {

                top:
                    10%;

                height:
                    112%;

                object-position:
                    center 62%;

            }


            .back-link {

                font-size:
                    0.29rem;

            }


            .hero-content h1 {

                font-size:
                    1.06rem;

            }


            .hero-content p {

                font-size:
                    0.29rem;

            }


            .media-btn {

                min-width:
                    40px;

                min-height:
                    17px;

                height:
                    17px;

                padding:
                    3px 8px;

                font-size:
                    0.31rem;

            }


            .gallery-grid-section {

                padding:
                    0 8px 42px;

            }


            .gallery-grid {

                column-gap:
                    3px;

            }


            .gallery-item {

                margin-bottom:
                    3px;

            }

        }


        /* ==================================================
           REDUCED MOTION
        ================================================== */

        @media (
            prefers-reduced-motion:
            reduce
        ) {

            html {

                scroll-behavior:
                    auto;

            }


            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

                scroll-behavior:
                    auto !important;

            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         SCROLL TO TOP
    ================================================== -->

    <div
        id="scroll-to-top-container"
    ></div>


    <!-- ==================================================
         NAVBAR
    ================================================== -->

    <div
        id="navbar-container"
    ></div>


    <!-- ==================================================
         HERO
    ================================================== -->

    <header
        class="hero-section"
    >

        <img
            src=""
            alt="Auren Branding Hero"
            class="hero-image"
            id="branding-hero-image"
        >


        <div
            class="hero-overlay"
        ></div>


        <div
            class="hero-content"
        >

            <a
                href="portfolio.html"
                class="back-link"
                id="back-to-portfolio"
            >
                ← Back to Portfolio
            </a>


            <h1>

                Branding

                <span
                    class="highlight"
                >
                    Production.
                </span>

            </h1>


            <p>

                A curation of visual identities,
                brand stories, creative direction,
                and distinctive design experiences
                brought to life through imagery.

            </p>

        </div>

    </header>


    <!-- ==================================================
         MEDIA FILTER
    ================================================== -->

    <section
        class="media-filter-section"
    >

        <div
            class="media-filter"
        >

            <button
                class="media-btn active"
                data-media="photos"
                type="button"
            >
                Photos
            </button>


            <button
                class="media-btn"
                data-media="videos"
                type="button"
            >
                Videos
            </button>

        </div>

    </section>


    <!-- ==================================================
         GALLERY
    ================================================== -->

    <section
        class="gallery-grid-section"
    >

        <div
            class="gallery-grid"
            id="dynamic-gallery"
        ></div>

    </section>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <div
        id="footer-container"
    ></div>


    <!-- ==================================================
         GSAP
    ================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
    ></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"
    ></script>


    <script>

        /* ==================================================
           LOAD NAVBAR
        ================================================== */

        fetch(
            './components/navbar.html',
            {
                cache:
                    'no-store'
            }
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        `Navbar HTTP error: ${response.status}`
                    );

                }

                return response.text();

            }
        )

        .then(
            html => {

                const container =
                    document.getElementById(
                        'navbar-container'
                    );


                if (
                    !container
                ) {

                    return;

                }


                container.innerHTML =
                    html;


                const workLink =
                    container.querySelector(
                        '.nav-links a[data-page="work"]'
                    );


                if (
                    workLink
                ) {

                    workLink.classList.add(
                        'active'
                    );

                }


                const mobileWorkLink =
                    container.querySelector(
                        '.mobile-nav-links a[data-page="work"]'
                    );


                if (
                    mobileWorkLink
                ) {

                    mobileWorkLink.classList.add(
                        'active'
                    );

                }

            }
        )

        .catch(
            error => {

                console.error(
                    'Navbar loading error:',
                    error
                );

            }
        );


        /* ==================================================
           LOAD FOOTER
        ================================================== */

        fetch(
            './components/footer.html',
            {
                cache:
                    'no-store'
            }
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        `Footer HTTP error: ${response.status}`
                    );

                }

                return response.text();

            }
        )

        .then(
            html => {

                const container =
                    document.getElementById(
                        'footer-container'
                    );


                if (
                    container
                ) {

                    container.innerHTML =
                        html;

                }

            }
        )

        .catch(
            error => {

                console.error(
                    'Footer loading error:',
                    error
                );

            }
        );


        /* ==================================================
           LOAD SCROLL TO TOP
        ================================================== */

        fetch(
            './components/scroll-to-top.html',
            {
                cache:
                    'no-store'
            }
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        `Scroll component HTTP error: ${response.status}`
                    );

                }

                return response.text();

            }
        )

        .then(
            html => {

                const container =
                    document.getElementById(
                        'scroll-to-top-container'
                    );


                if (
                    !container
                ) {

                    return;

                }


                container.innerHTML =
                    html;


                const button =
                    container.querySelector(
                        '#scroll-to-top'
                    );


                if (
                    !button
                ) {

                    return;

                }


                function updateButton() {

                    if (
                        window.scrollY > 500
                    ) {

                        button.classList.add(
                            'show'
                        );

                    }

                    else {

                        button.classList.remove(
                            'show'
                        );

                    }

                }


                window.addEventListener(
                    'scroll',
                    updateButton,
                    {
                        passive:
                            true
                    }
                );


                button.addEventListener(
                    'click',
                    () => {

                        window.scrollTo({

                            top:
                                0,

                            behavior:
                                'smooth'

                        });

                    }
                );


                updateButton();

            }
        )

        .catch(
            error => {

                console.error(
                    'Scroll component error:',
                    error
                );

            }
        );


        /* ==================================================
           BACK TO PORTFOLIO
        ================================================== */

        const backToPortfolio =
            document.getElementById(
                'back-to-portfolio'
            );


        if (
            backToPortfolio
        ) {

            backToPortfolio.addEventListener(
                'click',
                event => {

                    event.preventDefault();


                    /*
                     * Return to the exact page
                     * the user came from.
                     *
                     * Browser history restores
                     * the previous scroll position
                     * when applicable.
                     */

                    if (
                        window.history.length > 1
                    ) {

                        window.history.back();

                        return;

                    }


                    /*
                     * Fallback for a direct visit
                     * to this gallery page.
                     */

                    window.location.href =
                        'portfolio.html';

                }
            );

        }


        /* ==================================================
           BRANDING CONFIGURATION
        ================================================== */

        const photoApi =
            '/api/branding-photos';


        const videoApi =
            '/api/branding-videos';


        const heroApi =
            '/api/branding-hero';


        document.title =
            'Branding | Auren Originals';


        /* ==================================================
           ELEMENTS
        ================================================== */

        const galleryContainer =
            document.getElementById(
                'dynamic-gallery'
            );


        const mediaButtons =
            document.querySelectorAll(
                '.media-btn'
            );


        const heroImage =
            document.getElementById(
                'branding-hero-image'
            );


        /* ==================================================
           MEDIA URL
        ================================================== */

        function getMediaUrl(
            media
        ) {

            if (
                typeof media ===
                'string'
            ) {

                return media;

            }


            if (
                media &&
                typeof media ===
                'object'
            ) {

                return (

                    media.secure_url ||
                    media.url ||
                    ''

                );

            }


            return '';

        }


        /* ==================================================
           HERO
        ================================================== */

        if (
            heroImage
        ) {

            heroImage.style.visibility =
                'hidden';


            fetch(
                heroApi,
                {
                    method:
                        'GET',

                    cache:
                        'no-store'
                }
            )

            .then(
                response => {

                    if (!response.ok) {

                        throw new Error(
                            `Branding hero API returned HTTP ${response.status}`
                        );

                    }


                    return response.json();

                }
            )

            .then(
                data => {

                    const heroUrl =
                        getMediaUrl(
                            data
                        );


                    if (!heroUrl) {

                        throw new Error(
                            'Branding hero URL was not returned.'
                        );

                    }


                    heroImage.onload =
                        () => {

                            heroImage.style.visibility =
                                'visible';

                        };


                    heroImage.onerror =
                        () => {

                            console.error(
                                'Branding hero failed:',
                                heroUrl
                            );

                        };


                    heroImage.src =
                        heroUrl;

                }
            )

            .catch(
                error => {

                    console.error(
                        'Branding hero loading error:',
                        error
                    );

                }
            );

        }


        /* ==================================================
           VIDEO STATE
        ================================================== */

        let activeVideoItem =
            null;


        let activeVideo =
            null;


        let videoBackdrop =
            null;


        /* ==================================================
           VIDEO MIME TYPE
        ================================================== */

        function getVideoMimeType(
            media
        ) {

            const value =
                String(
                    media?.format ||
                    media?.display_name ||
                    media?.original_filename ||
                    media?.public_id ||
                    media ||
                    ''
                );


            const extension =
                value
                    .split('.')
                    .pop()
                    .toLowerCase();


            const types = {

                mp4:
                    'video/mp4',

                webm:
                    'video/webm',

                ogg:
                    'video/ogg',

                mov:
                    'video/quicktime'

            };


            return (
                types[extension]
                ||
                'video/mp4'
            );

        }


        /* ==================================================
           LOAD PHOTOS
        ================================================== */

        function loadPhotos() {

            closeZoomedVideo();


            galleryContainer.innerHTML =
                '';


            fetch(
                photoApi,
                {
                    method:
                        'GET',

                    cache:
                        'no-store'
                }
            )

            .then(
                response => {

                    if (!response.ok) {

                        throw new Error(
                            `Branding photo API returned HTTP ${response.status}`
                        );

                    }


                    return response.json();

                }
            )

            .then(
                photos => {

                    console.log(
                        'Branding photos:',
                        photos
                    );


                    if (
                        !Array.isArray(
                            photos
                        )
                        ||
                        photos.length === 0
                    ) {

                        galleryContainer.innerHTML = `

                            <p
                                class="empty-message"
                            >
                                No Branding photos
                                available yet.
                            </p>

                        `;

                        return;

                    }


                    photos.forEach(
                        photo => {

                            const imageUrl =
                                getMediaUrl(
                                    photo
                                );


                            if (!imageUrl) {

                                console.warn(
                                    'Branding photo has no URL:',
                                    photo
                                );

                                return;

                            }


                            const itemDiv =
                                document.createElement(
                                    'div'
                                );


                            itemDiv.className =
                                'gallery-item';


                            const image =
                                document.createElement(
                                    'img'
                                );


                            image.src =
                                imageUrl;


                            image.alt =
                                photo.display_name
                                ||
                                'Branding Gallery';


                            image.loading =
                                'lazy';


                            image.decoding =
                                'async';


                            image.onerror =
                                () => {

                                    console.error(
                                        'Branding image failed:',
                                        imageUrl
                                    );

                                };


                            itemDiv.appendChild(
                                image
                            );


                            galleryContainer.appendChild(
                                itemDiv
                            );

                        }
                    );


                    runGalleryAnimation();

                }
            )

            .catch(
                error => {

                    console.error(
                        'Branding photo loading error:',
                        error
                    );


                    galleryContainer.innerHTML = `

                        <p
                            class="empty-message"
                        >
                            Could not load Branding
                            photos.
                        </p>

                    `;

                }
            );

        }


        /* ==================================================
           LOAD VIDEOS
        ================================================== */

        function loadVideos() {

            closeZoomedVideo();


            galleryContainer.innerHTML =
                '';


            fetch(
                videoApi,
                {
                    method:
                        'GET',

                    cache:
                        'no-store'
                }
            )

            .then(
                response => {

                    if (!response.ok) {

                        throw new Error(
                            `Branding video API returned HTTP ${response.status}`
                        );

                    }


                    return response.json();

                }
            )

            .then(
                videos => {

                    console.log(
                        'Branding videos:',
                        videos
                    );


                    if (
                        !Array.isArray(
                            videos
                        )
                        ||
                        videos.length === 0
                    ) {

                        galleryContainer.innerHTML = `

                            <p
                                class="empty-message"
                            >
                                No Branding videos
                                available yet.
                            </p>

                        `;

                        return;

                    }


                    videos.forEach(
                        videoFile => {

                            const videoUrl =
                                getMediaUrl(
                                    videoFile
                                );


                            if (!videoUrl) {

                                console.warn(
                                    'Branding video has no URL:',
                                    videoFile
                                );

                                return;

                            }


                            const itemDiv =
                                document.createElement(
                                    'div'
                                );


                            itemDiv.className =
                                'gallery-item video-item';


                            const videoElement =
                                document.createElement(
                                    'video'
                                );


                            videoElement.preload =
                                'metadata';


                            videoElement.playsInline =
                                true;


                            videoElement.muted =
                                true;


                            const source =
                                document.createElement(
                                    'source'
                                );


                            source.src =
                                videoUrl;


                            source.type =
                                getVideoMimeType(
                                    videoFile
                                );


                            videoElement.appendChild(
                                source
                            );


                            itemDiv.appendChild(
                                videoElement
                            );


                            galleryContainer.appendChild(
                                itemDiv
                            );


                            videoElement.addEventListener(
                                'click',
                                event => {

                                    event.stopPropagation();


                                    openZoomedVideo(
                                        itemDiv,
                                        videoElement
                                    );

                                }
                            );


                            videoElement.addEventListener(
                                'contextmenu',
                                event => {

                                    event.preventDefault();

                                }
                            );

                        }
                    );


                    runGalleryAnimation();

                }
            )

            .catch(
                error => {

                    console.error(
                        'Branding video loading error:',
                        error
                    );


                    galleryContainer.innerHTML = `

                        <p
                            class="empty-message"
                        >
                            Could not load Branding
                            videos.
                        </p>

                    `;

                }
            );

        }


        /* ==================================================
           OPEN VIDEO
        ================================================== */

        function openZoomedVideo(
            itemDiv,
            videoElement
        ) {

            closeZoomedVideo();


            activeVideoItem =
                itemDiv;


            activeVideo =
                videoElement;


            videoBackdrop =
                document.createElement(
                    'div'
                );


            videoBackdrop.className =
                'video-backdrop';


            document.body.appendChild(
                videoBackdrop
            );


            document.body.style.overflow =
                'hidden';


            itemDiv.classList.add(
                'video-zoomed'
            );


            videoElement.controls =
                true;


            videoElement.pause();


            const closeButton =
                document.createElement(
                    'button'
                );


            closeButton.type =
                'button';


            closeButton.className =
                'video-close-btn';


            closeButton.textContent =
                '×';


            closeButton.setAttribute(
                'aria-label',
                'Close video'
            );


            itemDiv.appendChild(
                closeButton
            );


            closeButton.addEventListener(
                'click',
                event => {

                    event.stopPropagation();


                    closeZoomedVideo();

                }
            );


            videoBackdrop.addEventListener(
                'click',
                () => {

                    closeZoomedVideo();

                }
            );

        }


        /* ==================================================
           CLOSE VIDEO
        ================================================== */

        function closeZoomedVideo() {

            if (
                !activeVideoItem
            ) {

                return;

            }


            activeVideoItem.classList.remove(
                'video-zoomed'
            );


            if (
                activeVideo
            ) {

                activeVideo.pause();

                activeVideo.controls =
                    false;

            }


            const closeButton =
                activeVideoItem.querySelector(
                    '.video-close-btn'
                );


            if (
                closeButton
            ) {

                closeButton.remove();

            }


            if (
                videoBackdrop
            ) {

                videoBackdrop.remove();

                videoBackdrop =
                    null;

            }


            document.body.style.overflow =
                '';


            activeVideoItem =
                null;


            activeVideo =
                null;

        }


        /* ==================================================
           ESCAPE
        ================================================== */

        document.addEventListener(
            'keydown',
            event => {

                if (
                    event.key ===
                    'Escape'
                ) {

                    closeZoomedVideo();

                }

            }
        );


        /* ==================================================
           GALLERY ANIMATION
        ================================================== */

        function runGalleryAnimation() {

            if (
                typeof gsap ===
                'undefined'
            ) {

                return;

            }


            gsap.killTweensOf(
                '.gallery-item'
            );


            gsap.fromTo(

                '.gallery-item',

                {

                    y:
                        20,

                    opacity:
                        0

                },

                {

                    y:
                        0,

                    opacity:
                        1,

                    duration:
                        0.6,

                    stagger:
                        0.04,

                    ease:
                        'power3.out'

                }

            );

        }


        /* ==================================================
           MEDIA BUTTONS
        ================================================== */

        mediaButtons.forEach(
            button => {

                button.addEventListener(
                    'click',
                    () => {

                        mediaButtons.forEach(
                            item => {

                                item.classList.remove(
                                    'active'
                                );

                            }
                        );


                        button.classList.add(
                            'active'
                        );


                        if (
                            button.dataset.media ===
                            'photos'
                        ) {

                            loadPhotos();

                        }

                        else {

                            loadVideos();

                        }

                    }
                );

            }
        );


        /* ==================================================
           HERO ANIMATION
        ================================================== */

        if (
            typeof gsap !==
            'undefined'
        ) {

            gsap.to(
                '.hero-content',
                {

                    y:
                        0,

                    opacity:
                        1,

                    duration:
                        0.9,

                    delay:
                        0.12,

                    ease:
                        'power3.out'

                }
            );

        }


        /* ==================================================
           INITIAL LOAD
        ================================================== */

        loadPhotos();

    </script>

</body>

</html>
