<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <link
        rel="icon"
        href="/assets/favicon/favicon.ico"
        sizes="any"
    >


    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/assets/favicon/favicon-32x32.png"
    >


    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="/assets/favicon/favicon-16x16.png"
    >


    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/assets/favicon/favicon-180x180.png"
    >


    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-VECH9J2L1M"
    ></script>


    <script>

        window.dataLayer =
            window.dataLayer || [];


        function gtag() {

            dataLayer.push(
                arguments
            );

        }


        gtag(
            'js',
            new Date()
        );


        gtag(
            'config',
            'G-VECH9J2L1M'
        );

    </script>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        onload="this.onload=null;this.rel='stylesheet'"
    >


    <noscript>

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        >

    </noscript>


    <link
        rel="stylesheet"
        href="css/variables.css"
    >


    <link
        rel="stylesheet"
        href="css/global.css"
    >


    <link
        rel="stylesheet"
        href="css/components.css"
    >


    <link
        rel="stylesheet"
        href="css/gallery.css"
    >


    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body
    class="gallery-page"
    data-gallery="branding"
>


    <div
        id="scroll-to-top-container"
    ></div>


    <div
        id="navbar-container"
    ></div>


    <!-- ==================================================
         HERO
    ================================================== -->

    <header
        class="hero-section"
    >

        <img
            id="gallery-hero-image"
            class="hero-image"
            src=""
            alt="Auren Branding Hero"
        >


        <div
            class="hero-overlay"
        ></div>


        <div
            class="hero-content"
        >

            <a
                href="portfolio.html"
                id="back-to-portfolio"
                class="back-link"
            >
                ← Back to Portfolio
            </a>


            <h1
                id="gallery-title"
            ></h1>


            <p
                id="gallery-description"
            ></p>

        </div>

    </header>


    <!-- ==================================================
         MEDIA FILTER
    ================================================== -->

    <section
        class="media-filter-section"
    >

        <div
            class="media-filter"
        >

            <button
                type="button"
                class="media-btn active"
                data-media="photos"
            >
                Photos
            </button>


            <button
                type="button"
                class="media-btn"
                data-media="videos"
            >
                Videos
            </button>

        </div>

    </section>


    <!-- ==================================================
         GALLERY
    ================================================== -->

    <section
        class="gallery-grid-section"
    >

        <div
            id="dynamic-gallery"
            class="gallery-grid"
        ></div>

    </section>


    <div
        id="footer-container"
    ></div>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
    ></script>


    <script
        src="/js/gallery.js?v=6"
    ></script>


    <script
        src="/js/seo.js?v=6"
    ></script>


</body>

</html>
