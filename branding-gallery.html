<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- ==================================================
         FAVICON
    ================================================== -->

    <link
        rel="icon"
        href="/assets/favicon/favicon.ico"
        sizes="any"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/assets/favicon/favicon-32x32.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="/assets/favicon/favicon-16x16.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/assets/favicon/favicon-180x180.png"
    >


    <!-- ==================================================
         GOOGLE ANALYTICS 4
    ================================================== -->

    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-VECH9J2L1M"
    ></script>

    <script>

        window.dataLayer =
            window.dataLayer || [];


        function gtag() {

            dataLayer.push(
                arguments
            );

        }


        gtag(
            "js",
            new Date()
        );


        gtag(
            "config",
            "G-VECH9J2L1M"
        );

    </script>


    <!-- ==================================================
         FONTS
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
    >


    <!-- ==================================================
         SHARED CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/gallery.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body
    class="gallery-page"
    data-gallery="branding"
>


    <!-- ==================================================
         SCROLL TO TOP
    ================================================== -->

    <div
        id="scroll-to-top-container"
    ></div>


    <!-- ==================================================
         SHARED NAVBAR
    ================================================== -->

    <div
        id="navbar-container"
    ></div>


    <!-- ==================================================
         HERO
    ================================================== -->

    <header class="hero-section">

        <img
            src=""
            alt="Auren Branding Hero"
            class="hero-image"
            id="branding-hero-image"
        >


        <div
            class="hero-overlay"
        ></div>


        <div
            class="hero-content"
        >

            <a
                href="portfolio.html"
                class="back-link"
                id="back-to-portfolio"
            >
                ← Back to Portfolio
            </a>


            <h1 id="gallery-title">

                Branding

                <span class="highlight">
                    Production.
                </span>

            </h1>


            <p id="gallery-description">

                A curation of visual identities,
                brand stories, creative direction,
                and distinctive design experiences
                brought to life through imagery.

            </p>

        </div>

    </header>


    <!-- ==================================================
         MEDIA FILTER
    ================================================== -->

    <section
        class="media-filter-section"
    >

        <div class="media-filter">

            <button
                class="media-btn active"
                data-media="photos"
                type="button"
            >
                Photos
            </button>


            <button
                class="media-btn"
                data-media="videos"
                type="button"
            >
                Videos
            </button>

        </div>

    </section>


    <!-- ==================================================
         GALLERY
    ================================================== -->

    <section
        class="gallery-grid-section"
    >

        <div
            class="gallery-grid"
            id="dynamic-gallery"
        ></div>

    </section>


    <!-- ==================================================
         SHARED FOOTER
    ================================================== -->

    <div
        id="footer-container"
    ></div>


    <!-- ==================================================
         GSAP
    ================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
    ></script>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"
    ></script>


    <!-- ==================================================
         SHARED GALLERY JS
    ================================================== -->

    <script
        src="js/gallery.js"
    ></script>

</body>

</html>
