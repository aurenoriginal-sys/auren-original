<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==================================================
         META
    ================================================== -->

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- ==================================================
         FAVICON
    ================================================== -->

    <link
        rel="icon"
        href="/assets/favicon/favicon.ico"
        sizes="any"
    >


    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/assets/favicon/favicon-32x32.png"
    >


    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="/assets/favicon/favicon-16x16.png"
    >


    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/assets/favicon/favicon-180x180.png"
    >


    <!-- ==================================================
         GOOGLE ANALYTICS 4
    ================================================== -->

    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-VECH9J2L1M"
    ></script>


    <script>

        window.dataLayer =
            window.dataLayer || [];


        function gtag() {

            dataLayer.push(
                arguments
            );

        }


        gtag(
            'js',
            new Date()
        );


        gtag(
            'config',
            'G-VECH9J2L1M'
        );

    </script>


    <!-- ==================================================
         GOOGLE FONTS
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        onload="this.onload=null;this.rel='stylesheet'"
    >


    <noscript>

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        >

    </noscript>


    <!-- ==================================================
         PROJECT CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >


    <link
        rel="stylesheet"
        href="css/global.css"
    >


    <link
        rel="stylesheet"
        href="css/components.css"
    >


    <link
        rel="stylesheet"
        href="css/contact.css"
    >


    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body
    class="contact-page"
>


    <!-- ==================================================
         SCROLL TO TOP
    ================================================== -->

    <div
        id="scroll-to-top-container"
    ></div>


    <!-- ==================================================
         NAVBAR
    ================================================== -->

    <div
        id="navbar-container"
    ></div>


    <main>


        <!-- ==================================================
             HERO
        ================================================== -->

        <section
            class="contact-hero"
        >

            <div
                class="contact-hero-content"
            >

                <h1
                    class="reveal"
                ></h1>


                <p
                    class="contact-hero-copy reveal"
                ></p>


                <a
                    href="#project-form"
                    class="hero-start-button reveal"
                ></a>

            </div>

        </section>


        <!-- ==================================================
             PROJECT FORM
        ================================================== -->

        <section
            id="project-form"
            class="form-section"
        >

            <img
                id="contact-background-image"
                src=""
                alt=""
                class="form-background"
            >


            <div
                class="form-overlay"
            ></div>


            <div
                class="form-layout"
            >

                <div
                    class="form-intro"
                >

                    <p
                        class="section-label reveal"
                    ></p>


                    <h2
                        class="reveal"
                    ></h2>


                    <p
                        class="form-intro-copy reveal"
                    ></p>

                </div>


                <div
                    class="form-panel"
                >

                    <form
                        id="contact-form"
                    >


                        <!-- NAME -->

                        <div
                            class="form-group"
                        >

                            <label
                                class="form-label"
                                for="name"
                            ></label>


                            <input
                                id="name"
                                name="name"
                                type="text"
                                class="form-field"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div
                            class="form-group"
                        >

                            <label
                                class="form-label"
                                for="email"
                            ></label>


                            <input
                                id="email"
                                name="email"
                                type="email"
                                class="form-field"
                                required
                            >

                        </div>


                        <!-- PHONE -->

                        <div
                            class="form-group"
                        >

                            <label
                                class="form-label"
                                for="phone"
                            ></label>


                            <input
                                id="phone"
                                name="phone"
                                type="tel"
                                class="form-field"
                                required
                            >

                        </div>


                        <!-- COMPANY -->

                        <div
                            class="form-group"
                        >

                            <label
                                class="form-label"
                                for="company"
                            ></label>


                            <input
                                id="company"
                                name="company"
                                type="text"
                                class="form-field"
                            >

                        </div>


                        <!-- PROJECT TYPE + BUDGET -->

                        <div
                            class="form-row"
                        >

                            <div
                                class="form-group"
                            >

                                <label
                                    class="form-label"
                                    for="projectType"
                                ></label>


                                <select
                                    id="projectType"
                                    name="projectType"
                                    class="form-select"
                                    required
                                ></select>

                            </div>


                            <div
                                class="form-group"
                            >

                                <label
                                    class="form-label"
                                    for="budget"
                                ></label>


                                <select
                                    id="budget"
                                    name="budget"
                                    class="form-select"
                                    required
                                ></select>

                            </div>

                        </div>


                        <!-- TIMELINE -->

                        <div
                            class="form-group"
                        >

                            <label
                                class="form-label"
                                for="timeline"
                            ></label>


                            <select
                                id="timeline"
                                name="timeline"
                                class="form-select"
                                required
                            ></select>

                        </div>


                        <!-- MESSAGE -->

                        <div
                            class="form-group"
                        >

                            <label
                                class="form-label"
                                for="message"
                            ></label>


                            <textarea
                                id="message"
                                name="message"
                                class="form-textarea"
                                required
                            ></textarea>

                        </div>


                        <!-- SUBMIT -->

                        <button
                            id="submit-button"
                            type="submit"
                            class="submit-button"
                        ></button>


                        <p
                            id="form-status"
                            class="form-status"
                        ></p>

                    </form>

                </div>

            </div>

        </section>


        <!-- ==================================================
             REACH US
        ================================================== -->

        <section
            class="reach-section"
        >

            <div
                class="contact-container"
            >

                <div
                    class="reach-header reveal"
                >

                    <p
                        class="section-label"
                    ></p>


                    <h2
                        class="reach-title"
                    ></h2>

                </div>


                <div
                    id="reach-grid"
                    class="reach-grid"
                ></div>

            </div>

        </section>


        <!-- ==================================================
             FAQ
        ================================================== -->

        <section
            class="faq-section"
        >

            <div
                class="contact-container"
            >

                <div
                    class="faq-layout"
                >

                    <div
                        class="faq-heading"
                    >

                        <p
                            class="section-label"
                        ></p>


                        <h2></h2>

                    </div>


                    <div
                        id="faq-list"
                        class="faq-list"
                    ></div>

                </div>

            </div>

        </section>


        <!-- ==================================================
             WHAT HAPPENS NEXT
        ================================================== -->

        <section
            class="process-section"
        >

            <div
                class="contact-container"
            >

                <div
                    class="process-title-wrap reveal"
                >

                    <h2
                        class="process-title"
                    ></h2>

                </div>


                <div
                    id="process-list"
                    class="process-list"
                ></div>

            </div>

        </section>


        <!-- ==================================================
             FINAL CTA
             Shared CTA component
        ================================================== -->

        <section
            class="final-cta"
        >

            <div
                class="final-cta-inner"
            >

                <h2
                    class="reveal"
                ></h2>


                <p
                    class="final-cta-copy reveal"
                ></p>


                <div
                    id="final-cta-buttons"
                    class="cta-buttons reveal"
                ></div>

            </div>

        </section>


    </main>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <div
        id="footer-container"
    ></div>


    <!-- ==================================================
         CONTACT JAVASCRIPT
    ================================================== -->

    <script
        src="/js/contact.js?v=1"
    ></script>


    <!-- ==================================================
         SEO
    ================================================== -->

    <script
        src="/js/seo.js?v=3"
    ></script>


</body>

</html>
