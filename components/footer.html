<!-- ==================================================
     DYNAMIC LOGO
     SAME API AS NAVBAR
================================================== -->

<script>

fetch('/api/site-logo')

    .then(
        response => {

            if (!response.ok) {

                throw new Error(
                    `Logo API returned ${response.status}`
                );

            }

            return response.json();

        }
    )

    .then(
        data => {

            const logo =
                document.getElementById(
                    'site-logo-footer'
                );


            if (
                logo &&
                data &&
                data.secure_url
            ) {

                logo.src =
                    data.secure_url;

            }

        }
    )

    .catch(
        error => {

            console.error(
                'Footer logo loading error:',
                error
            );

        }
    );

</script>
