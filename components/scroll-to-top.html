<style>

    .scroll-to-top {

        position: fixed;

        left: 50%;
        bottom: 28px;

        width: 40px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: center;

        transform:
            translateX(-50%)
            translateY(20px)
            scale(0.92);

        border:
            1px solid
            rgba(255, 255, 255, 0.28);

        border-radius: 50%;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,0.16),
                rgba(255,255,255,0.04)
            );

        color: #ffffff;

        font-family:
            Arial, sans-serif;

        font-size: 10px;

        line-height: 1;

        cursor: pointer;

        opacity: 0;
        visibility: hidden;

        z-index: 99999;

        /* Glass blur */
        backdrop-filter:
            blur(14px);

        -webkit-backdrop-filter:
            blur(14px);

        /* Soft outer depth */
        box-shadow:
            0 8px 24px
            rgba(0, 0, 0, 0.45),

            inset 0 1px 1px
            rgba(255,255,255,0.18),

            inset 0 -1px 1px
            rgba(0,0,0,0.25);

        transition:
            opacity 0.35s ease,
            visibility 0.35s ease,
            transform 0.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),
            background 0.3s ease,
            border-color 0.3s ease,
            box-shadow 0.3s ease;

    }


    /* =========================================
       VISIBLE STATE
    ========================================= */

    .scroll-to-top.show {

        opacity: 1;

        visibility: visible;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }


    /* =========================================
       HOVER
    ========================================= */

    .scroll-to-top:hover {

        background:
            linear-gradient(
                145deg,
                rgba(174, 174, 174, 0.8),
                rgba(174,174,174,0.42)
            );

        border-color:
            rgba(255, 255, 255, 0.85);

        color:
            #000000;

        transform:
            translateX(-50%)
            translateY(-5px)
            scale(1.04);

        box-shadow:
            0 12px 30px
            rgba(0, 0, 0, 0.50),

            0 0 18px
            rgba(19, 19, 19, 0.22),

            inset 0 1px 1px
            rgba(255,255,255,0.30);

    }


    /* =========================================
       ACTIVE / CLICK
    ========================================= */

    .scroll-to-top:active {

        transform:
            translateX(-50%)
            translateY(-1px)
            scale(0.98);

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

        .scroll-to-top {

            width: 46px;
            height: 46px;

            bottom: 20px;

            font-size: 20px;

        }

    }

</style>


<button
    id="scroll-to-top"
    class="scroll-to-top"
    type="button"
    aria-label="Back to top"
    title="Back to top"
>
    ↑
</button>
