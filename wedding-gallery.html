            object-position:center;

            z-index:0;
filter: brightness(.50);
            visibility:hidden;

            transform:scale(1.05);

            animation:

                        0

        >

            <a
                href="portfolio.html"
                class="back-link"
                id="back-to-portfolio"
            >
                ← Back to Portfolio
            </a>


            <h1
                id="gallery-title"
            >

                Wedding

                <span
                    class="highlight"
                >
                    Production.
                </span>

            </h1>


            <p
                id="gallery-description"
            >

                A curation of intimate moments,
                luxury direction, and timeless styling
                captured in pristine detail.

            </p>

        </div>

    </header>


    <!-- ==================================================
         PHOTOS / VIDEOS
    ================================================== -->

    <section
        class="media-filter-section"
    >

        <div
            class="media-filter"
        >

            <button
                class="media-btn active"
                data-media="photos"
                type="button"
            >
                Photos
            </button>


            <button
                class="media-btn"
                data-media="videos"
                type="button"
            >
                Videos
            </button>

        </div>

    </section>


    <!-- ==================================================
         GALLERY
    ================================================== -->

    <section
        class="gallery-grid-section"
    >

        <div
            class="gallery-grid"
            id="dynamic-gallery"
        ></div>

    </section>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <div
        id="footer-container"
    ></div>


    <!-- ==================================================
         GSAP
    ================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
    ></script>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"
    ></script>


    <script>

        /* ==================================================
           SCROLL TO TOP
        ================================================== */

        fetch(
            'components/scroll-to-top.html',
            {
                cache:
                    'no-store'
            }
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        `Scroll component failed: ${response.status}`
                    );
                }

                return response.text();

            }
        )

        .then(
            html => {

                const container =
                    document.getElementById(
                        'scroll-to-top-container'
                    );


                if (!container) {
                    return;
                }


                container.innerHTML =
                    html;


                const button =
                    container.querySelector(
                        '#scroll-to-top'
                    );


                if (!button) {
                    return;
                }


                function updateButton() {

                    if (
                        window.scrollY > 500
                    ) {

                        button.classList.add(
                            'show'
                        );

                    }

                    else {

                        button.classList.remove(
                            'show'
                        );

                    }

                }


                window.addEventListener(
                    'scroll',
                    updateButton,
                    {
                        passive:
                            true
                    }
                );


                button.addEventListener(
                    'click',
                    () => {

                        window.scrollTo({

                            top:
                                0,

                            behavior:
                                'smooth'

                        });

                    }
                );


                updateButton();

            }
        )

        .catch(
            error => {

                console.error(
                    'Scroll-to-top component error:',
                    error
                );

            }
        );


        /* ==================================================
           NAVBAR
        ================================================== */

        fetch(
            'components/navbar.html',
            {
                cache:
                    'no-store'
            }
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        'Navbar could not be loaded'
                    );
                }

                return response.text();

            }
        )

        .then(
            data => {

                const container =
                    document.getElementById(
                        'navbar-container'
                    );


                if (!container) {
                    return;
                }


                container.innerHTML =
                    data;


                const workLink =
                    container.querySelector(
                        '.nav-links a[data-page="work"]'
                    );


                const mobileWorkLink =
                    container.querySelector(
                        '.mobile-nav-links a[data-page="work"]'
                    );


                if (workLink) {

                    workLink.classList.add(
                        'active'
                    );

                }


                if (mobileWorkLink) {

                    mobileWorkLink.classList.add(
                        'active'
                    );

                }

            }
        )

        .catch(
            error => {

                console.error(
                    'Navbar loading error:',
                    error
                );

            }
        );


        /* ==================================================
           FOOTER
        ================================================== */

        fetch(
            'components/footer.html',
            {
                cache:
                    'no-store'
            }
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        'Footer could not be loaded'
                    );
                }

                return response.text();

            }
        )

        .then(
            data => {

                const container =
                    document.getElementById(
                        'footer-container'
                    );


                if (container) {

                    container.innerHTML =
                        data;

                }

            }
        )

        .catch(
            error => {

                console.error(
                    'Footer loading error:',
                    error
                );

            }
        );


        /* ==================================================
           BACK TO PORTFOLIO
        ================================================== */

        const backButton =
            document.getElementById(
                'back-to-portfolio'
            );


        if (backButton) {

            backButton.addEventListener(
                'click',
                event => {

                    event.preventDefault();


                    if (
                        window.history.length > 1
                    ) {

                        window.history.back();

                    }

                    else {

                        window.location.href =
                            'portfolio.html';

                    }

                }
            );

        }


        /* ==================================================
           CATEGORY
        ================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const galleryCategory =
            params.get(
                'category-2'
            )
            ||
            'wedding';


        const isPreWedding =
            galleryCategory ===
            'pre-wedding';


        const galleryName =
            isPreWedding
                ? 'Pre-Wedding'
                : 'Wedding';


        /* ==================================================
           API ENDPOINTS
        ================================================== */

        const photoApi =
            isPreWedding
                ? '/api/pre-wedding-photos'
                : '/api/wedding-photos';


        const videoApi =
            isPreWedding
                ? '/api/pre-wedding-videos'
                : '/api/wedding-videos';


        const heroApi =
            isPreWedding
                ? '/api/pre-wedding-hero'
                : '/api/wedding-hero';


        const mediaFolder =
            isPreWedding
                ? 'pre-wedding'
                : 'wedding';


        const serverOrigin =
            window.location.origin;


        /* ==================================================
           PAGE TITLE
        ================================================== */

        document.title =
            `${galleryName} | Auren Originals`;


        /* ==================================================
           HERO IMAGE
        ================================================== */

        const heroImage =
            document.getElementById(
                'wedding-hero-image'
            );


        if (heroImage) {

            heroImage.style.visibility =
                'hidden';


            heroImage.onload =
                () => {

                    heroImage.style.visibility =
                        'visible';

                };


            fetch(
                `${serverOrigin}${heroApi}`,
                {
                    method:
                        'GET',

                    cache:
                        'no-store'
                }
            )

            .then(
                response => {

                    if (!response.ok) {

                        throw new Error(
                            `${galleryName} hero API returned HTTP ${response.status}`
                        );
                    }

                    return response.json();

                }
            )

            .then(
                data => {

                    const heroUrl =
                        typeof data === 'string'
                            ? data
                            : (
                                data?.secure_url ||
                                data?.url ||
                                ''
                            );


                    if (!heroUrl) {

                        throw new Error(
                            `${galleryName} hero URL was not returned`
                        );
                    }


                    heroImage.src =
                        heroUrl;

                }
            )

            .catch(
                error => {

                    console.error(
                        `${galleryName} hero loading error:`,
                        error
                    );

                }
            );

        }


        /* ==================================================
           TITLE
        ================================================== */

        const galleryTitle =
            document.getElementById(
                'gallery-title'
            );


        if (galleryTitle) {

            galleryTitle.innerHTML = `

                ${galleryName}

                <span
                    class="highlight"
                >
                    Production.
                </span>

            `;

        }


        /* ==================================================
           DESCRIPTION
        ================================================== */

        const galleryDescription =
            document.getElementById(
                'gallery-description'
            );


        if (galleryDescription) {

            galleryDescription.textContent =

                isPreWedding

                    ? 'A curation of romantic moments, cinematic imagery, and timeless pre-wedding stories captured in pristine detail.'

                    : 'A curation of intimate moments, luxury direction, and timeless styling captured in pristine detail.';

        }


        /* ==================================================
           ELEMENTS
        ================================================== */

        const galleryContainer =
            document.getElementById(
                'dynamic-gallery'
            );


        const mediaButtons =
            document.querySelectorAll(
                '.media-btn'
            );


        /* ==================================================
           VIDEO STATE
        ================================================== */

        let activeVideoItem = null;

        let activeVideo = null;

        let videoBackdrop = null;


        /* ==================================================
           VIDEO MIME TYPE
        ================================================== */

        function getVideoMimeType(
            filename
        ) {

            const extension =
                String(
                    filename
                )
                .split('.')
                .pop()
                .toLowerCase();


            const mimeTypes = {

                mp4:
                    'video/mp4',

                webm:
                    'video/webm',

                ogg:
                    'video/ogg',

                mov:
                    'video/quicktime'
            };


            return (
                mimeTypes[extension]
                ||
                'video/mp4'
            );
        }


        /* ==================================================
           MEDIA URL
        ================================================== */

        function getMediaUrl(
            media
        ) {

            if (
                typeof media ===
                'string'
            ) {

                return media;
            }


            if (
                media &&
                typeof media ===
                'object'
            ) {

                return (
                    media.secure_url
                    ||
                    media.url
                    ||
                    media.path
                    ||
                    media.filename
                    ||
                    ''
                );
            }


            return '';
        }


        /* ==================================================
           PHOTO PATH
        ================================================== */

        function getPhotoPath(
            media
        ) {

            const value =
                getMediaUrl(
                    media
                );


            if (!value) {
                return '';
            }


            if (
                /^https?:\/\//i.test(
                    value
                )
            ) {

                return value;
            }


            return (
                `${serverOrigin}/images/` +
                `${mediaFolder}/photos/` +
                encodeURIComponent(
                    value
                )
            );
        }


        /* ==================================================
           VIDEO PATH
        ================================================== */

        function getVideoPath(
            media
        ) {

            const value =
                getMediaUrl(
                    media
                );


            if (!value) {
                return '';
            }


            if (
                /^https?:\/\//i.test(
                    value
                )
            ) {

                return value;
            }


            return (
                `${serverOrigin}/images/` +
                `${mediaFolder}/videos/` +
                encodeURIComponent(
                    value
                )
            );
        }


        /* ==================================================
           LOAD PHOTOS
        ================================================== */

        function loadPhotos() {

            closeZoomedVideo();


            galleryContainer.innerHTML =
                '';


            fetch(
                `${serverOrigin}${photoApi}`,
                {
                    method:
                        'GET',

                    cache:
                        'no-store'
                }
            )

            .then(
                response => {

                    if (!response.ok) {

                        throw new Error(
                            `${galleryName} photo API returned HTTP ${response.status}`
                        );
                    }

                    return response.json();

                }
            )

            .then(
                photos => {

                    if (
                        !Array.isArray(
                            photos
                        )
                        ||
                        photos.length === 0
                    ) {

                        galleryContainer.innerHTML = `

                            <p
                                class="empty-message"
                            >
                                No ${
                                    galleryName
                                    .toLowerCase()
                                }
                                photos available yet.
                            </p>

                        `;

                        return;
                    }


                    photos.forEach(
                        photo => {

                            const imageUrl =
                                getPhotoPath(
                                    photo
                                );


                            if (!imageUrl) {
                                return;
                            }


                            const galleryItem =
                                document.createElement(
                                    'div'
                                );


                            galleryItem.className =
                                'gallery-item';


                            const image =
                                document.createElement(
                                    'img'
                                );


                            image.src =
                                imageUrl;


                            image.alt =
                                `${galleryName} Gallery`;


                            image.loading =
                                'lazy';


                            image.decoding =
                                'async';


                            galleryItem.appendChild(
                                image
                            );


                            galleryContainer.appendChild(
                                galleryItem
                            );

                        }
                    );


                    runGalleryAnimation();

                }
            )

            .catch(
                error => {

                    console.error(
                        `${galleryName} photo loading error:`,
                        error
                    );


                    galleryContainer.innerHTML = `

                        <p
                            class="empty-message"
                        >
                            Could not load
                            ${
                                galleryName
                                .toLowerCase()
                            }
                            photos.
                        </p>

                    `;

                }
            );
        }


        /* ==================================================
           LOAD VIDEOS
        ================================================== */

        function loadVideos() {

            closeZoomedVideo();


            galleryContainer.innerHTML =
                '';


            fetch(
                `${serverOrigin}${videoApi}`,
                {
                    method:
                        'GET',

                    cache:
                        'no-store'
                }
            )

            .then(
                response => {

                    if (!response.ok) {

                        throw new Error(
                            `${galleryName} video API returned HTTP ${response.status}`
                        );
                    }

                    return response.json();

                }
            )

            .then(
                videos => {

                    if (
                        !Array.isArray(
                            videos
                        )
                        ||
                        videos.length === 0
                    ) {

                        galleryContainer.innerHTML = `

                            <p
                                class="empty-message"
                            >
                                No ${
                                    galleryName
                                    .toLowerCase()
                                }
                                videos available yet.
                            </p>

                        `;

                        return;
                    }


                    videos.forEach(
                        videoFile => {

                            const videoUrl =
                                getVideoPath(
                                    videoFile
                                );


                            if (!videoUrl) {
                                return;
                            }


                            const itemDiv =
                                document.createElement(
                                    'div'
                                );


                            itemDiv.className =
                                'gallery-item video-item';


                            const videoElement =
                                document.createElement(
                                    'video'
                                );


                            videoElement.preload =
                                'metadata';


                            videoElement.playsInline =
                                true;


                            videoElement.muted =
                                true;


                            const source =
                                document.createElement(
                                    'source'
                                );


                            source.src =
                                videoUrl;


                            source.type =
                                getVideoMimeType(
                                    getMediaUrl(
                                        videoFile
                                    )
                                );


                            videoElement.appendChild(
                                source
                            );


                            itemDiv.appendChild(
                                videoElement
                            );


                            galleryContainer.appendChild(
                                itemDiv
                            );


                            videoElement.addEventListener(
                                'click',
                                event => {

                                    event.stopPropagation();


                                    openZoomedVideo(
                                        itemDiv,
                                        videoElement
                                    );
                                }
                            );

                        }
                    );


                    runGalleryAnimation();

                }
            )

            .catch(
                error => {

                    console.error(
                        `${galleryName} video loading error:`,
                        error
                    );


                    galleryContainer.innerHTML = `

                        <p
                            class="empty-message"
                        >
                            Could not load
                            ${
                                galleryName
                                .toLowerCase()
                            }
                            videos.
                        </p>

                    `;

                }
            );
        }


        /* ==================================================
           OPEN VIDEO
        ================================================== */

        function openZoomedVideo(
            itemDiv,
            videoElement
        ) {

            closeZoomedVideo();


            activeVideoItem =
                itemDiv;

            activeVideo =
                videoElement;


            videoBackdrop =
                document.createElement(
                    'div'
                );


            videoBackdrop.className =
                'video-backdrop';


            document.body.appendChild(
                videoBackdrop
            );


            document.body.style.overflow =
                'hidden';


            itemDiv.classList.add(
                'video-zoomed'
            );


            videoElement.controls =
                true;


            const closeButton =
                document.createElement(
                    'button'
                );


            closeButton.type =
                'button';


            closeButton.className =
                'video-close-btn';


            closeButton.textContent =
                '×';


            closeButton.setAttribute(
                'aria-label',
                'Close video'
            );


            itemDiv.appendChild(
                closeButton
            );


            closeButton.addEventListener(
                'click',
                event => {

                    event.stopPropagation();

                    closeZoomedVideo();

                }
            );


            videoBackdrop.addEventListener(
                'click',
                closeZoomedVideo
            );
        }


        /* ==================================================
           CLOSE VIDEO
        ================================================== */

        function closeZoomedVideo() {

            if (!activeVideoItem) {
                return;
            }


            activeVideoItem.classList.remove(
                'video-zoomed'
            );


            if (activeVideo) {

                activeVideo.pause();

                activeVideo.controls =
                    false;
            }


            const closeButton =
                activeVideoItem.querySelector(
                    '.video-close-btn'
                );


            if (closeButton) {

                closeButton.remove();
            }


            if (videoBackdrop) {

                videoBackdrop.remove();

                videoBackdrop =
                    null;
            }


            document.body.style.overflow =
                '';


            activeVideoItem =
                null;

            activeVideo =
                null;
        }


        /* ==================================================
           ESCAPE
        ================================================== */

        document.addEventListener(
            'keydown',
            event => {

                if (
                    event.key ===
                    'Escape'
                ) {

                    closeZoomedVideo();
                }

            }
        );


        /* ==================================================
           GALLERY ANIMATION
        ================================================== */

        function runGalleryAnimation() {

            if (
                typeof gsap ===
                'undefined'
            ) {

                return;
            }


            gsap.killTweensOf(
                '.gallery-item'
            );


            gsap.fromTo(

                '.gallery-item',

                {

                    y:
                        14,

                    opacity:
                        0
                },

                {

                    y:
                        0,

                    opacity:
                        1,

                    duration:
                        0.55,

                    stagger:
                        0.025,

                    ease:
                        'power2.out'
                }
            );
        }


        /* ==================================================
           FILTER BUTTONS
        ================================================== */

        mediaButtons.forEach(
            button => {

                button.addEventListener(
                    'click',
                    () => {

                        mediaButtons.forEach(
                            item => {

                                item.classList.remove(
                                    'active'
                                );

                            }
                        );


                        button.classList.add(
                            'active'
                        );


                        if (
                            button.dataset.media ===
                            'photos'
                        ) {

                            loadPhotos();

                        }

                        else {

                            loadVideos();

                        }

                    }
                );

            }
        );


        /* ==================================================
           HERO CONTENT
        ================================================== */

        if (
            typeof gsap !==
            'undefined'
        ) {

            if (
                window.innerWidth >
                767
            ) {

                gsap.to(
                    '.hero-content',
                    {

                        y: 0,

                        opacity: 1,

                        duration:
                            0.9,

                        delay:
                            0.12,

                        ease:
                            'power3.out'
                    }
                );

            }

            else {

                gsap.set(
                    '.hero-content',
                    {

                        x: 0,

                        y: 0,

                        opacity: 1
                    }
                );

            }
        }


        /* ==================================================
           INITIAL LOAD
        ================================================== */

        loadPhotos();

    </script>

</body>

</html>
